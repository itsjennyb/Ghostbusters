name: Deploy Frontend to S3

on:
  push:
    branches:
      - dev
    paths:
      - 'client/**'
  workflow_dispatch:

jobs:
  deploy:
    name: Build & Deploy React Frontend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: client

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Get Terraform outputs
        id: terraform
        working-directory: terraform
        run: |
          terraform init
          CLOUDFRONT_ID=$(terraform output -raw cloudfront_distribution_id)
          BUCKET_NAME=$(terraform output -raw frontend_bucket_name_actual)
          GRAPHQL_URL=$(terraform output -raw graphql_url)
          echo "cloudfront_id=$CLOUDFRONT_ID" >> $GITHUB_OUTPUT
          echo "bucket_name=$BUCKET_NAME" >> $GITHUB_OUTPUT
          echo "graphql_url=$GRAPHQL_URL" >> $GITHUB_OUTPUT
          echo "Using CloudFront ID: $CLOUDFRONT_ID"
          echo "Using S3 bucket: $BUCKET_NAME"
          echo "Using GraphQL URL: $GRAPHQL_URL"

      - name: Set up Node
        uses: actions/setup-node@v3
        with:
          node-version: 22.18.0

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: CI=false npm run build
        env:
          REACT_APP_GRAPHQL_URI: ${{ steps.terraform.outputs.graphql_url }}

      - name: Upload to S3
        run: |
          echo "Uploading built assets to: ${{ steps.terraform.outputs.bucket_name }}"
          aws s3 sync ./build s3://${{ steps.terraform.outputs.bucket_name }} --delete --acl bucket-owner-full-control

      - name: Invalidate CloudFront cache
        run: |
          echo "Invalidating CloudFront distribution: ${{ steps.terraform.outputs.cloudfront_id }}"
          aws cloudfront create-invalidation \
            --distribution-id ${{ steps.terraform.outputs.cloudfront_id }} \
            --paths "/*"