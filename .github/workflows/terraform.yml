name: Deploy Lambda API and Infra via Terraform

on:
  push:
    branches:
      - dev
  workflow_dispatch:

jobs:
  terraform:
    name: Terraform Apply
    runs-on: ubuntu-latest

    env:
      AWS_REGION: us-east-1
      ECR_REPOSITORY: ghostbusters-lambda
      FUNCTION_NAME: ghostbusters-lambda-dev

    defaults:
      run:
        working-directory: terraform

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.13.5

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: Build and push Docker image to ECR
        run: |
          docker build -t ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest ../server
          docker push ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest

      - name: Update Lambda to use latest image
        run: |
          aws lambda update-function-code \
            --function-name ${{ env.FUNCTION_NAME }} \
            --image-uri ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest \
            --region ${{ env.AWS_REGION }}

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate

      - name: Import existing routes (if they exist)
        run: |
          # Get API Gateway ID
          API_ID=$(aws apigatewayv2 get-apis --query "Items[?Name=='ghostbusters-lambda-API-dev'].ApiId" --output text)

          if [ -n "$API_ID" ]; then
            echo "Found API Gateway: $API_ID"

            # Get OPTIONS route ID
            OPTIONS_ROUTE_ID=$(aws apigatewayv2 get-routes --api-id "$API_ID" --query "Items[?RouteKey=='OPTIONS /graphql'].RouteId" --output text)
            if [ -n "$OPTIONS_ROUTE_ID" ]; then
              echo "Importing OPTIONS route: $OPTIONS_ROUTE_ID"
              terraform import "aws_apigatewayv2_route.graphql_options" "$API_ID/$OPTIONS_ROUTE_ID" || echo "OPTIONS route import failed or already imported"
            fi

            # Get healthz route ID
            HEALTHZ_ROUTE_ID=$(aws apigatewayv2 get-routes --api-id "$API_ID" --query "Items[?RouteKey=='GET /healthz'].RouteId" --output text)
            if [ -n "$HEALTHZ_ROUTE_ID" ]; then
              echo "Importing healthz route: $HEALTHZ_ROUTE_ID"
              terraform import "aws_apigatewayv2_route.healthz" "$API_ID/$HEALTHZ_ROUTE_ID" || echo "Healthz route import failed or already imported"
            fi
          else
            echo "No existing API Gateway found, will create new resources"
          fi
        continue-on-error: true

      - name: Terraform Plan
        run: terraform plan

      - name: Terraform Apply
        run: terraform apply -auto-approve

      - name: Output Infrastructure URLs
        run: |
          echo "====== DEPLOYMENT COMPLETE ======"
          echo "GraphQL Endpoint: $(terraform output -raw graphql_url)"
          echo "Health Check: $(terraform output -raw healthz_url)"
          echo "CloudFront URL: $(terraform output -raw cloudfront_url)"
          echo "CloudFront Distribution ID: $(terraform output -raw cloudfront_distribution_id)"
          echo "S3 Bucket: $(terraform output -raw frontend_bucket_name_actual)"
